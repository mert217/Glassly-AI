# Glassly Android uygulamasını (APK) derler, imzalar ve GitHub sürümüne Glassly.apk olarak yükler.
# Yeni bir sürüm etiketi (ör. v0.2.0) gönderildiğinde ya da Actions → "Android sürümü" → Run workflow ile çalışır.
name: Android sürümü

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sürüm etiketi (ör. v0.2.0)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund
      - name: Android projesi
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0b0b24' --splashBackgroundColor '#eef1f8'
          npx cap sync android
      - name: Sürüm numarası
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"; V="${TAG#v}"
          IFS=. read -r A B C <<< "$V"; CODE=$(( ${A:-0}*10000 + ${B:-0}*100 + ${C:-0} )); [ "$CODE" -gt 0 ] || CODE=1
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Derle
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease
      - name: İmzala
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > glassly.p12
            "$BT/apksigner" sign --ks glassly.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --out Glassly.apk aligned.apk
          else
            keytool -genkeypair -keystore tmp.jks -storepass android -keypass android -alias g -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Glassly"
            "$BT/apksigner" sign --ks tmp.jks --ks-pass pass:android --out Glassly.apk aligned.apk
          fi
          "$BT/apksigner" verify --print-certs Glassly.apk | head -3
          ls -la Glassly.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: mobile/Glassly.apk
