<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Glassly</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1d2140;background:radial-gradient(900px 600px at 20% 0%,#dfe4ff,transparent),radial-gradient(800px 600px at 100% 100%,#d7f3ff,transparent),#eef1f8}
  .card{margin:24px;padding:28px 26px;max-width:360px;text-align:center;border-radius:24px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 50px rgba(40,50,110,.14);backdrop-filter:blur(18px)}
  h1{font-size:20px;margin:14px 0 6px} p{margin:0 0 20px;color:#5b6083}
  button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 22px;color:#fff;background:linear-gradient(135deg,#7b6cff,#3fb8f0);cursor:pointer}
  .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#8b7bff,#4fd6ff);margin:0 auto}
</style></head>
<body><div class="card"><div class="logo"></div><h1>Bağlantı yok</h1><p>Glassly'ye ulaşılamadı. İnternet bağlantını kontrol edip tekrar dene.</p><button onclick="location.href='https://glassly.biz/app/'">Tekrar dene</button></div></body></html>
